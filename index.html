<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reasons Why I Love You</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Great+Vibes&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { 
            --gold: #B8860B; 
            --butter-yellow: #FFFDD0; 
            --romantic-red: #4a0e0e;
        }
        body { 
            background-color: var(--butter-yellow); 
            color: var(--romantic-red); 
            font-family: 'Playfair Display', serif; 
            overflow: hidden; 
            height: 100vh; 
            margin: 0; 
        }
        .cinzel { font-family: 'Cinzel', serif; }
        .romantic-script { font-family: 'Great Vibes', cursive; }

        /* Raining Animation Background */
        .emoji-rain {
            position: fixed;
            top: -50px;
            user-select: none;
            pointer-events: none;
            z-index: 0;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }

        .card-stack { perspective: 1000px; position: relative; z-index: 10; }
        .card { transition: transform 0.6s ease; transform-style: preserve-3d; cursor: pointer; position: absolute; inset: 0; }
        .card-face { backface-visibility: hidden; position: absolute; width: 100%; height: 100%; border-radius: 12px; border: 2px solid var(--gold); box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .card-back { background: linear-gradient(135deg, #F0E68C 0%, #FFFDD0 100%); display: flex; align-items: center; justify-content: center; }
        .card-back::after { content: '❤'; font-size: 3rem; color: var(--gold); opacity: 0.4; }
        
        #revealStage { position: fixed; inset: 0; z-index: 9999; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); }
        .active-card { width: 310px; height: 480px; background: #fff; color: #1a0b0b; border-radius: 15px; border: 3px solid var(--gold); padding: 1.5rem; display: flex; flex-direction: column; align-items: center; animation: slideUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; z-index: 10000; }
        
        @keyframes slideUp { from { transform: translateY(100vh) scale(0.5); } to { transform: translateY(0) scale(1); } }
        
        #muteBtn { position: fixed; top: 20px; right: 20px; z-index: 10005; background: white; border: 2px solid var(--gold); border-radius: 50%; padding: 10px; color: var(--gold); cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* Typewriter Cursor */
        .cursor { display: inline-block; width: 2px; background-color: var(--gold); margin-left: 3px; animation: blink 0.7s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div id="greetingOverlay" class="fixed inset-0 z-[10001] bg-[var(--butter-yellow)] flex items-center justify-center p-6 text-center">
        <div class="max-w-md">
            <h2 class="romantic-script text-7xl text-[var(--gold)] mb-4">Hello, My Love</h2>
            <p class="cinzel text-lg tracking-widest mb-8 opacity-80 text-[var(--romantic-red)]">I built this just for you.</p>
            <button id="enterBtn" class="px-12 py-4 border-2 border-[var(--gold)] text-[var(--gold)] cinzel uppercase tracking-widest hover:bg-[var(--gold)] hover:text-white transition-all font-bold">
                Click Here
            </button>
        </div>
    </div>

    <audio id="bgMusic" loop preload="auto">
        <source src="assets/this is why I love.mp3" type="audio/mpeg">
    </audio>

    <button id="muteBtn" title="Toggle Music">
        <i id="muteIcon" data-lucide="volume-2"></i>
    </button>

    <main class="relative h-screen flex flex-col items-center justify-center p-4">
        <header class="absolute top-10 text-center z-20">
            <h1 class="cinzel text-3xl md:text-5xl text-[var(--gold)] uppercase tracking-tighter">Reasons Why I Love You</h1>
            <p id="counter" class="italic opacity-60 mt-2 text-[var(--romantic-red)]">Tap the deck to draw</p>
        </header>

        <div id="deckContainer" class="card-stack w-64 h-80 md:w-72 md:h-96"></div>

        <div id="revealStage">
            <div id="cardContent" class="active-card shadow-2xl"></div>
        </div>

        <div id="finale" class="hidden fixed inset-0 flex flex-col items-center justify-center text-center p-8 z-[10002] bg-[var(--butter-yellow)]">
            <h2 class="romantic-script text-5xl md:text-6xl text-[var(--gold)] mb-6">Always & Forever</h2>
            
            <div class="max-w-xl mx-auto">
                <span id="typewriter-text" class="cinzel text-base md:text-lg leading-relaxed text-[var(--romantic-red)]"></span>
                <span id="cursor" class="cursor hidden">|</span>
            </div>

            <button id="replayBtn" class="invisible mt-10 px-8 py-2 border border-[var(--gold)] text-[var(--gold)] cinzel uppercase hover:bg-[var(--gold)] hover:text-white transition-all text-sm">Start Over</button>
        </div>
    </main>

    <script>
        // EDIT YOUR MESSAGE HERE
        const finaleMessage = "I never want to run out of ways of expressing my love to you! I would learn new tricks and skills every day if I know it will bring a smile to your face. I love you always and I will keep trying to be your Mr Perfect. To you My Forever Valentine, Teminikan, MY CUPCAKE! HAPPY VALENTINE'S DAY!";

        // VIDEO DATA (7 Cards)
        const REASONS = [
            { text: "Because you are the Most Beautiful Woman Ever!!!", video: "assets/01.mp4" },
            { text: "Because we look so good together and I am at my happiest when I am with you", video: "assets/02.mp4" },
            { text: "Because you are so smart and you make me so so proud of you everytime", video: "assets/03.mp4" },
            { text: "Because you are the cutest woman ever and every video of us kissing is something I can watch forever", video: "assets/04.mp4" },
            { text: "I mean just take a look at this beauty nowwww!!", video: "assets/05.mp4" },
            { text: "Because you are the sexiest woman alive, and you make my dick so hard and happy!", video: "assets/06.mp4" },
            { text: "Because together we are the cutest couples alive!", video: "assets/07.mp4" }
        ];

        let deck = [...REASONS];
        const container = document.getElementById('deckContainer');
        const bgMusic = document.getElementById('bgMusic');
        const revealStage = document.getElementById('revealStage');
        const cardContent = document.getElementById('cardContent');
        const enterBtn = document.getElementById('enterBtn');
        const muteBtn = document.getElementById('muteBtn');
        const muteIcon = document.getElementById('muteIcon');

        // Emoji Rain
        const emojis = ['❤️', '🌸', '🌹', '✨', '💖', '🌷'];
        function createRain() {
            const emoji = document.createElement('div');
            emoji.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            emoji.className = 'emoji-rain';
            emoji.style.left = Math.random() * 100 + 'vw';
            emoji.style.animationDuration = Math.random() * 2 + 3 + 's';
            emoji.style.fontSize = Math.random() * 10 + 20 + 'px';
            document.body.appendChild(emoji);
            setTimeout(() => emoji.remove(), 5000);
        }
        setInterval(createRain, 400);

        // Start Logic
        enterBtn.onclick = () => {
            bgMusic.play().catch(e => console.log("Audio play blocked by browser."));
            document.getElementById('greetingOverlay').style.display = 'none';
            renderDeck();
        };

        muteBtn.onclick = () => {
            bgMusic.muted = !bgMusic.muted;
            muteIcon.setAttribute('data-lucide', bgMusic.muted ? 'volume-x' : 'volume-2');
            lucide.createIcons();
        };

        function renderDeck() {
            container.innerHTML = '';
            deck.forEach((card, index) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card';
                cardEl.style.zIndex = index;
                const r = (Math.random() * 6 - 3).toFixed(2);
                cardEl.style.transform = `rotate(${r}deg) translateY(${index * -1}px)`;
                cardEl.innerHTML = `<div class="card-face card-back"></div>`;
                if (index === deck.length - 1) cardEl.onclick = () => revealCard(card);
                container.appendChild(cardEl);
            });
            document.getElementById('counter').innerText = `${deck.length} memories remaining`;
        }

        function revealCard(data) {
            cardContent.innerHTML = `
                <video src="${data.video}" class="w-full h-3/5 object-cover rounded shadow-md mb-4" loop muted playsinline></video>
                <p class="text-center italic text-lg px-2 text-black font-semibold">"${data.text}"</p>
                <button id="closeBtn" class="mt-auto mb-2 px-10 py-3 bg-[#4a0e0e] text-white text-xs uppercase tracking-widest rounded-full font-bold">Next Reason</button>
            `;
            revealStage.style.display = 'flex';
            const v = cardContent.querySelector('video');
            if(v) v.play().catch(e => console.log("Video blocked"));
            
            document.getElementById('closeBtn').onclick = () => {
                revealStage.style.display = 'none';
                deck.pop();
                deck.length === 0 ? triggerFinale() : renderDeck();
            };
        }

        // TYPEWRITER ENGINE
        function runTypewriter(text) {
            const textEl = document.getElementById("typewriter-text");
            const cursorEl = document.getElementById("cursor");
            cursorEl.classList.remove('hidden');
            let i = 0;
            function type() {
                if (i < text.length) {
                    textEl.textContent += text.charAt(i);
                    i++;
                    setTimeout(type, 45); 
                } else {
                    cursorEl.classList.add('hidden');
                    document.getElementById('replayBtn').classList.remove('invisible');
                }
            }
            type();
        }

        function triggerFinale() {
            document.getElementById('finale').classList.remove('hidden');
            confetti({ particleCount: 200, spread: 80, origin: { y: 0.6 }, colors: ['#B8860B', '#FFFDD0'] });
            setTimeout(() => runTypewriter(finaleMessage), 1000);
        }

        document.getElementById('replayBtn').onclick = () => {
            localStorage.clear();
            location.reload();
        };

        lucide.createIcons();
    </script>
</body>
</html>
